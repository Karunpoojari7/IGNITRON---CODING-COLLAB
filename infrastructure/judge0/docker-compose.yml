services:
  server:
    image: mrkushalsm/judge0@sha256:d60605ad448453ac3754629bc7121d379cf691e0c091aabbc03ff2886b2626b2
    container_name: ignitron-judge0-server
    restart: always
    privileged: true
    env_file:
      - ./judge0.local.conf
    volumes:
      - ./judge0.local.conf:/judge0.conf:ro
    ports:
      - "127.0.0.1:2358:2358"
    environment:
      - VIRTUAL_HOST=localhost
      - VIRTUAL_PORT=2358
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ignitron-judge0-net

  workers:
    image: mrkushalsm/judge0@sha256:d60605ad448453ac3754629bc7121d379cf691e0c091aabbc03ff2886b2626b2
    container_name: ignitron-judge0-workers
    command: ["./scripts/workers"]
    restart: always
    privileged: true
    cgroup: host
    environment:
      - COUNT=1
    env_file:
      - ./judge0.local.conf
    volumes:
      - ./judge0.local.conf:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ignitron-judge0-net

  db:
    image: postgres:13.0
    container_name: ignitron-judge0-db
    restart: always
    env_file:
      - ./judge0.local.conf
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
    volumes:
      - judge0-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ignitron-judge0-net

  redis:
    image: redis:7.2-alpine
    container_name: ignitron-judge0-redis
    restart: always
    env_file:
      - ./judge0.local.conf
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - judge0-redis-data:/data
    networks:
      - ignitron-judge0-net

volumes:
  judge0-db-data:
    name: ignitron-judge0-db-data
  judge0-redis-data:
    name: ignitron-judge0-redis-data

networks:
  ignitron-judge0-net:
    name: ignitron-judge0-net
    driver: bridge
